# Template: <service>/docker/conf/nginx.conf — SPA served by nginx.
#
# Installed as /etc/nginx/conf.d/default.conf, so this is a `server` block only,
# not a full nginx.conf.
#
# The API proxy block is commented out. Uncomment it only if the SPA talks to a
# sibling container instead of a public API domain; `resolver` points at Docker's
# internal DNS so the upstream is resolved at request time rather than at
# startup, which lets nginx boot before the API container is ready.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable; index.html must never be cached or
    # clients keep loading a stale bundle after a deploy.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routing: unknown paths serve the app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # location /graphql {
