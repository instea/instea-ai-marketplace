# Template: .github/workflows/release.yml
#
# Replace before use:
#   <project>  -> repo name, e.g. retros
#   the matrix `include:` entries -> one per service that gets an image
#
# If the repo's default branch is not `main`, change it in BOTH triggers and in
# the release job's `if:` guard.

name: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker:
    name: Build & push ${{ matrix.image }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: app
            context: ./src/app
            dockerfile: ./src/app/docker/Dockerfile
          - image: api
            context: ./src/api
            dockerfile: ./src/api/docker/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Skipped on pull requests: nothing is pushed there, and PRs from forks
      # cannot read secrets, so attempting to log in would fail the job.
      - name: Log in to registry.instea.co
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: registry.instea.co
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      # On a pull request this builds and throws the image away, which is the
      # point: it proves the Dockerfile still builds without touching :latest.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: registry.instea.co/<project>-${{ matrix.image }}:latest
        env:
          DOCKER_BUILD_SUMMARY: false # Keep the Actions run page readable

  release:
    name: Create GitHub release
    needs: docker
    # Without this guard the release job runs on pull requests and quietly
    # republishes the release from an unmerged branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Versions are bumped by hand, so several commits share one version.
      # Deleting first lets the release move to the newest main commit instead
      # of failing on "tag already exists"; `|| true` covers the first ever run.
      - name: Delete existing release and tag
        run: gh release delete "v${{ steps.pkg.outputs.version }}" --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: v${{ steps.pkg.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
