# --- Instea code quality checks (Python), severity: error -------------------------------------
# Generated by /project-setup:create-code-quality-checks. See docs/code-quality.md.

[dependency-groups]
dev = [
  "complexipy==8.3.0",
  "deptry==0.25.1",
  "mypy==2.4.1",
  "pip-audit==2.10.1",
  "poethepoet==0.49.0",
  "ruff==0.17.3",
  "vulture==2.16",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C90", "PL", "B", "SIM", "UP", "PERF", "RUF"]
# PLR2004 (magic value comparison) flags almost every numeric literal; too noisy to be useful.
ignore = ["PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 4

[tool.poe.env]
# Source directory the checks scan (e.g. "src", the package dir, or ".").
PY_SRC = "src"

[tool.poe.tasks]
lint = "ruff check"
format-check = { shell = "ruff format --check" }
typecheck = { shell = "mypy ${PY_SRC}" }
complexity = "complexipy ${PY_SRC} --max-complexity-allowed 15"
deadcode = { shell = "vulture ${PY_SRC} vulture_allowlist.py --min-confidence 60" }
deps = { shell = "deptry ." }
duplication = "npx --yes jscpd@5.4.2 --config .jscpd.json --format python ."
build = { shell = "uv build" }
audit = { shell = "f=$(mktemp) && uv export --no-dev --no-emit-project --no-hashes --format requirements-txt -o \"$f\" >/dev/null && pip-audit --strict --disable-pip --no-deps -r \"$f\"; s=$?; rm -f \"$f\"; exit $s" }
check = ["lint", "format-check", "typecheck", "complexity", "deadcode", "deps", "duplication", "build", "audit"]
