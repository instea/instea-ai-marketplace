# Instea code quality checks. Generated by /project-setup:create-code-quality-checks.
# Keep the "--- ts ---" / "--- python ---" blocks for the stacks this repo has; delete the others.
# Existing bitbucket-pipelines.yml: merge these steps into its pipelines.
# Commands are the repo's own scripts/tasks, so every failure reproduces locally.
# Audit steps live only under pull-requests, so they never run on pushes to the default branch.

definitions:
  caches:
    pnpm: .pnpm-store
    uv: .uv-cache
  steps:
    # --- ts ---
    - step: &ts-checks
        name: ts-checks
        image: node:24.22.2-trixie-slim # match the major in package.json engines.node
        caches: [pnpm]
        condition:
          changesets:
            includePaths:
              - "**/*.ts"
              - "**/*.tsx"
              - "**/*.js"
              - "**/*.jsx"
              - "**/package.json"
              - pnpm-lock.yaml
              - eslint.config.js
              - .jscpd.json
        script:
          - npm install -g "$(node -p 'require("./package.json").packageManager')"
          - pnpm config set store-dir .pnpm-store
          - pnpm install --frozen-lockfile
          - pnpm run lint
          - pnpm run format:check
          - pnpm run typecheck
          - pnpm run build:check
          - pnpm run knip
          - pnpm run duplication
    - step: &ts-audit
        name: ts-audit
        image: node:24.22.2-trixie-slim
        caches: [pnpm]
        script:
          - npm install -g "$(node -p 'require("./package.json").packageManager')"
          - pnpm config set store-dir .pnpm-store
          - pnpm install --frozen-lockfile
          - pnpm run audit
    # --- end ts ---
    # --- python ---
    - step: &py-checks
        name: py-checks
        image: ghcr.io/astral-sh/uv:0.13.6-python3.13-trixie-slim
        caches: [uv]
        condition:
          changesets:
            includePaths:
              - "**/*.py"
              - pyproject.toml
              - uv.lock
              - .jscpd.json
        script:
          - export UV_CACHE_DIR=.uv-cache UV_LINK_MODE=copy
          # Node only for jscpd (duplication); drop if the repo skips it or uses Pylint.
          - apt-get update -qq && apt-get install -y -qq nodejs npm >/dev/null
          - uv sync --locked
          - uv run poe lint
          - uv run poe format-check
          - uv run poe typecheck
          - uv run poe build
          - uv run poe complexity
          - uv run poe deadcode
          - uv run poe deps
          - uv run poe duplication
    - step: &py-audit
        name: py-audit
        image: ghcr.io/astral-sh/uv:0.13.6-python3.13-trixie-slim
        caches: [uv]
        script:
          - export UV_CACHE_DIR=.uv-cache UV_LINK_MODE=copy
          - uv sync --locked
          - uv run poe audit
    # --- end python ---

pipelines:
  pull-requests:
    "**":
      - parallel:
          steps:
            # --- ts ---
            - step: *ts-checks
            - step: *ts-audit
            # --- end ts ---
            # --- python ---
            - step: *py-checks
            - step: *py-audit
            # --- end python ---
  branches:
    main: # the repo's default branch
      - parallel:
          steps:
            # --- ts ---
            - step: *ts-checks
            # --- end ts ---
            # --- python ---
            - step: *py-checks
            # --- end python ---
