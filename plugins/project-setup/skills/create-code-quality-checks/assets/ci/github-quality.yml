# Instea code quality checks. Generated by /project-setup:create-code-quality-checks.
# Keep the "--- ts ---" / "--- python ---" blocks for the stacks this repo has; delete the others.
# Commands are the repo's own scripts/tasks, so every failure reproduces locally.
name: quality

on:
  pull_request:
  push:
    branches: [main] # the repo's default branch

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            ts:
              - '**/*.{ts,tsx,js,jsx,mjs,cjs,vue}'
              - '**/package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'eslint.config.js'
              - '.jscpd.json'
            python:
              - '**/*.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.jscpd.json'

  # --- ts ---
  ts:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: lint, run: "pnpm run lint && pnpm run format:check" }
          - { name: typecheck, run: "pnpm run typecheck" }
          - { name: build, run: "pnpm run build:check" }
          - { name: static-analysis, run: "pnpm run knip && pnpm run duplication" }
    name: ts-${{ matrix.check.name }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0 # version from package.json "packageManager"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json # engines.node
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.check.run }}

  ts-audit:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run audit
  # --- end ts ---

  # --- python ---
  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: lint, run: "uv run poe lint --output-format=github && uv run poe format-check" }
          - { name: typecheck, run: "uv run poe typecheck" }
          - { name: build, run: "uv run poe build" }
          - { name: static-analysis, run: "uv run poe complexity && uv run poe deadcode && uv run poe deps && uv run poe duplication" }
    name: py-${{ matrix.check.name }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3 # Python comes from requires-python
        with:
          enable-cache: true
      # Node only for jscpd (duplication); remove if the repo skips it or uses Pylint instead.
      - uses: actions/setup-node@v7.1.0
        if: matrix.check.name == 'static-analysis'
        with:
          node-version: 24
      - run: uv sync --locked
      - run: ${{ matrix.check.run }}

  py-audit:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run poe audit
  # --- end python ---
