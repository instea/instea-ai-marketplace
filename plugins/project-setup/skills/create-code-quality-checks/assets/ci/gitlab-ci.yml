# Instea code quality checks. Generated by /project-setup:create-code-quality-checks.
# Keep the "--- ts ---" / "--- python ---" blocks for the stacks this repo has; delete the others.
# Existing .gitlab-ci.yml: merge these jobs (and the "quality" stage) into it.
# Commands are the repo's own scripts/tasks, so every failure reproduces locally.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - quality

# --- ts ---
.ts:
  stage: quality
  image: node:24.22.2-trixie-slim # match the major in package.json engines.node
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]
  before_script:
    - npm install -g "$(node -p 'require("./package.json").packageManager')"
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  rules:
    - changes:
        - "**/*.{ts,tsx,js,jsx,mjs,cjs,vue}"
        - "**/package.json"
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - eslint.config.js
        - .jscpd.json

ts-lint:
  extends: .ts
  script:
    - pnpm run lint
    - pnpm run format:check

ts-typecheck:
  extends: .ts
  script:
    - pnpm run typecheck

ts-build:
  extends: .ts
  script:
    - pnpm run build:check

ts-static-analysis:
  extends: .ts
  script:
    - pnpm run knip
    - pnpm run duplication

ts-audit:
  extends: .ts
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/package.json"
        - pnpm-lock.yaml
  script:
    - pnpm run audit
# --- end ts ---

# --- python ---
.python:
  stage: quality
  image: ghcr.io/astral-sh/uv:0.13.6-python3.13-trixie-slim # uv still honours requires-python
  variables:
    UV_CACHE_DIR: .uv-cache
    UV_LINK_MODE: copy
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache]
  before_script:
    - uv sync --locked
  rules:
    - changes:
        - "**/*.py"
        - pyproject.toml
        - uv.lock
        - .jscpd.json

py-lint:
  extends: .python
  script:
    - uv run poe lint
    - uv run poe format-check

py-typecheck:
  extends: .python
  script:
    - uv run poe typecheck

py-build:
  extends: .python
  script:
    - uv run poe build

py-static-analysis:
  extends: .python
  # Node only for jscpd (duplication); drop the apt line if the repo skips it or uses Pylint.
  script:
    - apt-get update -qq && apt-get install -y -qq nodejs npm >/dev/null
    - uv run poe complexity
    - uv run poe deadcode
    - uv run poe deps
    - uv run poe duplication

py-audit:
  extends: .python
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - pyproject.toml
        - uv.lock
  script:
    - uv run poe audit
# --- end python ---
