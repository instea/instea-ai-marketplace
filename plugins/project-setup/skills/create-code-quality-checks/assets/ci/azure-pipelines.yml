# Instea code quality checks. Generated by /project-setup:create-code-quality-checks.
# Keep the "--- ts ---" / "--- python ---" blocks for the stacks this repo has; delete the others.
# Existing azure-pipelines.yml: merge these jobs into it.
# Commands are the repo's own scripts/tasks, so every failure reproduces locally.
# Azure has no per-job path filters: in a mixed repo every PR runs both stacks.

trigger:
  branches:
    include: [main] # the repo's default branch
pr:
  branches:
    include: ["*"]

pool:
  vmImage: ubuntu-24.04

jobs:
  # --- ts ---
  - job: ts
    strategy:
      matrix:
        lint: { CHECK: "pnpm run lint && pnpm run format:check" }
        typecheck: { CHECK: "pnpm run typecheck" }
        build: { CHECK: "pnpm run build:check" }
        static_analysis: { CHECK: "pnpm run knip && pnpm run duplication" }
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: "24.x" # match the major in package.json engines.node
      - script: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - script: pnpm install --frozen-lockfile
      - script: $(CHECK)

  - job: ts_audit
    condition: eq(variables['Build.Reason'], 'PullRequest')
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: "24.x"
      - script: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - script: pnpm install --frozen-lockfile
      - script: pnpm run audit
  # --- end ts ---

  # --- python ---
  - job: python
    strategy:
      matrix:
        lint: { CHECK: "uv run poe lint && uv run poe format-check" }
        typecheck: { CHECK: "uv run poe typecheck" }
        build: { CHECK: "uv run poe build" }
        static_analysis: { CHECK: "uv run poe complexity && uv run poe deadcode && uv run poe deps && uv run poe duplication" }
    steps:
      # Node (preinstalled on the image) is only needed for jscpd (duplication).
      - script: curl -LsSf https://astral.sh/uv/0.13.6/install.sh | sh
      - script: echo "##vso[task.prependpath]$HOME/.local/bin"
      - script: uv sync --locked
      - script: $(CHECK)

  - job: py_audit
    condition: eq(variables['Build.Reason'], 'PullRequest')
    steps:
      - script: curl -LsSf https://astral.sh/uv/0.13.6/install.sh | sh
      - script: echo "##vso[task.prependpath]$HOME/.local/bin"
      - script: uv sync --locked
      - script: uv run poe audit
  # --- end python ---
